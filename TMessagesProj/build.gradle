import org.gradle.nativeplatform.platform.internal.DefaultNativePlatform

apply plugin: 'com.android.library'
apply plugin: 'org.telegram.build-plugin'
apply plugin: 'idea'

idea {
    module {
        excludeDirs += [
            file('jni/td'),
            file('jni/third_party/absl'),
            file('jni/third_party/boringssl'),
            file('jni/third_party/dav1d'),
            file('jni/third_party/ffmpeg'),
            file('jni/third_party/libvpx'),
            file('jni/third_party/libyuv'),
            file('jni/third_party/openh264'),
            file('jni/third_party/xiph'),
            file('jni/third_party/wamr'),
            file('jni/third_party/libprisma'),
            file('jni/third_party/boost-regex'),
            file('jni/tgcalls'),
            file('jni/tlottie'),
            file('jni/voip/webrtc'),
            file('jni/sqlite')
        ]
    }
}

repositories {
    mavenCentral()
    google()
    maven { url "https://maven.aliucord.com/releases" } // exteraGram plugins: Aliuhook (Xposed API on LSPlant)
    maven { url uri("libs/maven") } // Aliuhook 1.1.4-sg1: XposedBridge.log(Throwable) made public, see scripts/patch-aliuhook.py
}

configurations {
    compile.exclude module: 'support-v4'
}

configurations.all {
    exclude group: 'com.google.firebase', module: 'firebase-core'
    exclude group: 'androidx.recyclerview', module: 'recyclerview'
}

dependencies {
